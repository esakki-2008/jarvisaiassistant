name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-companion
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Clean project
        run: ./gradlew clean

      - name: Run lint
        run: ./gradlew lintRelease --warning-mode all

      - name: Build release APK
        run: ./gradlew assembleRelease --warning-mode all

      - name: Locate release APK
        id: locate_apk
        shell: bash
        run: |
          apk="$(find app/build/outputs -type f -name '*.apk' -size +0c -print -quit)"
          test -n "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "APK found: $apk"
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-companion-release
          path: android-companion/${{ steps.locate_apk.outputs.apk }}
          if-no-files-found: error
